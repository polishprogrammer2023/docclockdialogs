<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Doc Clock Dialog</title>
<style>
    body { font-family: Arial, sans-serif; background: #f0f0f0; padding: 20px; }
    .dialog { background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); max-width: 600px; margin: 20px auto; }
    .character { font-weight: bold; color: #333; }
    .line { margin: 5px 0; }
    button { padding: 10px 20px; font-size: 16px; cursor: pointer; margin-bottom: 20px; }
</style>
</head>
<body>

<h1>Doc Clock Dialog</h1>
<button id="loadBtn">Pobierz dialog</button>

<div id="dialogContainer"></div>

<script>
async function loadDialog() {
    const container = document.getElementById('dialogContainer');
    container.innerHTML = 'Ładowanie...';

    try {
        const response = await fetch('https://docclockapi.pythonanywhere.com/api/dialog/random');
        if (!response.ok) throw new Error('Błąd sieci: ' + response.status);
        const data = await response.json();

        container.innerHTML = ''; // wyczyść poprzedni dialog

        const dialog = data.dialog;
        if (dialog.doc_clock) {
            const div = document.createElement('div');
            div.className = 'dialog';
            div.innerHTML = `<div class="line"><span class="character">Doc Clock:</span> ${dialog.doc_clock}</div>`;
            
            if (dialog.torb) {
                div.innerHTML += `<div class="line"><span class="character">Torb:</span> ${dialog.torb}</div>`;
            }

            container.appendChild(div);
        } else {
            container.textContent = 'Brak dialogu w odpowiedzi.';
        }
    } catch (err) {
        container.textContent = 'Błąd: ' + err.message;
    }
}

document.getElementById('loadBtn').addEventListener('click', loadDialog);
</script>

</body>
</html>
